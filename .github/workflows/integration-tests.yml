name: Database integration tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request: {}

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL repository integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paylessforai
          POSTGRES_PASSWORD: paylessforai
          POSTGRES_DB: paylessforai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paylessforai -d paylessforai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run PostgreSQL repository integration tests
        env:
          POSTGRES_TEST_DSN: postgres://paylessforai:paylessforai@localhost:5432/paylessforai?sslmode=disable
        run: GOCACHE="$RUNNER_TEMP/go-cache" go test ./internal/db/repositories -run Integration -count=1
