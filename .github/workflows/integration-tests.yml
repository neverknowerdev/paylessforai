name: Database integration tests

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request: {}

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite repository integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Bob generated models
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/stephenafamo/bob/gen/bobgen-sql@v0.50.0
          PATH="$RUNNER_TEMP/bin:$PATH" GOCACHE="$RUNNER_TEMP/go-cache" go generate ./internal/db
          git diff --exit-code -- internal/db/bob

      - name: Run SQLite repository integration tests
        run: GOCACHE="$RUNNER_TEMP/go-cache" go test ./internal/db/repositories -run Integration -count=1
