name: Publish main snapshot

on:
  push:
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Qualify
        run: |
          GOCACHE="$RUNNER_TEMP/go-cache" go test ./...
          GOCACHE="$RUNNER_TEMP/go-cache" go vet ./...
      - name: Browser qualification
        working-directory: test/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm test
      - name: Build signed snapshot
        env:
          OFFICIAL_BUILD: "true"
          UPDATE_PUBLIC_KEY: ${{ vars.UPDATE_PUBLIC_KEY }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          snapshot_date="$(date -u +%d.%m)"
          existing_tags="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          version="$(printf '%s\n' "$existing_tags" | bash scripts/next-main-version.sh "$snapshot_date")"
          echo "Publishing main snapshot as $version"
          bash scripts/build-release.sh "$version" main "$version" dist
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version dist/update-manifest.json)"
          gh release create "$version" dist/assets/* dist/update-manifest.json dist/update-manifest.json.sig dist/checksums.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "$version" --notes "Automated main snapshot for ${GITHUB_SHA}."
