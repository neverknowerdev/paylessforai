name: Stat-server tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request: {}

permissions:
  contents: read

jobs:
  unit:
    name: Stat-server unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run stat-server unit tests
        run: GOCACHE="$RUNNER_TEMP/go-cache" go test ./internal/statserver/... -count=1
      - name: Run stat-server race tests
        run: GOCACHE="$RUNNER_TEMP/go-cache" go test -race ./internal/statserver/... -count=1
      - name: Run stat-server vet
        run: GOCACHE="$RUNNER_TEMP/go-cache" go vet ./internal/statserver/...
      - name: Check formatting
        run: git diff --check

  postgres:
    name: PostgreSQL repository integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stat_server_test
          POSTGRES_USER: stat_server
          POSTGRES_PASSWORD: stat_server
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stat_server -d stat_server_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      STAT_SERVER_TEST_DATABASE_URL: postgres://stat_server:stat_server@127.0.0.1:5432/stat_server_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run every SQL repository integration test
        run: GOCACHE="$RUNNER_TEMP/go-cache" go test ./internal/statserver/repositories -run SQL -count=1
