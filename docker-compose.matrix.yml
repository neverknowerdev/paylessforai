name: paylessforai-matrix

# Mock-only harness for the NEV-59 matrix (NEV-59 review fix §2/§3).
# The full harness (3 mock upstreams + app) runs INSIDE docker compose;
# the Playwright spec only drives HTTP against it (MATRIX_EXTERNAL=1).
# Images are prebuilt from Dockerfile.e2e (module layer caching, instant
# start) — `go run` inside services never became ready in CI in time.
# No separate harness-stub leg: matrix.spec.ts covers basic + tool-use +
# streaming on every format x provider cell, which subsumes the stub.

services:
  mock-openrouter:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      args:
        PKG: ./cmd/mockprovider
    command: ["-listen", "0.0.0.0:8080", "-fixtures", "/fixtures"]
    volumes:
      - ./test/e2e/mocks/matrix:/fixtures:ro
    expose:
      - "8080"
    ports:
      - "19474:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-surplus:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      args:
        PKG: ./cmd/mockprovider
    command: ["-listen", "0.0.0.0:8080", "-fixtures", "/fixtures"]
    volumes:
      - ./test/e2e/mocks/matrix:/fixtures:ro
    expose:
      - "8080"
    ports:
      - "19475:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-opencode:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      args:
        PKG: ./cmd/mockprovider
    command: ["-listen", "0.0.0.0:8080", "-fixtures", "/fixtures"]
    volumes:
      - ./test/e2e/mocks/matrix:/fixtures:ro
    expose:
      - "8080"
    ports:
      - "19476:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  paylessforai-app:
    build:
      context: .
      dockerfile: Dockerfile.e2e
      args:
        PKG: ./cmd/paylessforai-app
    volumes:
      - payless-matrix-data:/tmp/payless-matrix
    command:
      - -data-dir
      - /tmp/payless-matrix
      - -listen
      - 0.0.0.0:9472
    expose:
      - "9472"
    ports:
      - "19477:9472"
    depends_on:
      mock-openrouter:
        condition: service_healthy
      mock-surplus:
        condition: service_healthy
      mock-opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9472/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  payless-matrix-data:
