name: paylessforai-matrix

# Mock-only harness for the NEV-59 matrix (NEV-59 review fix §2/§3).
# The full harness (3 mock upstreams + app) runs INSIDE docker compose;
# the Playwright spec only drives HTTP against it (MATRIX_EXTERNAL=1).
# No separate harness-stub leg: matrix.spec.ts covers basic + tool-use +
# streaming on every format x provider cell, which subsumes the stub.

services:
  mock-openrouter:
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
    command: ["go", "run", "./cmd/mockprovider", "-listen", "0.0.0.0:8080", "-fixtures", "test/e2e/mocks/matrix"]
    expose:
      - "8080"
    ports:
      - "19474:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-surplus:
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
    command: ["go", "run", "./cmd/mockprovider", "-listen", "0.0.0.0:8080", "-fixtures", "test/e2e/mocks/matrix"]
    expose:
      - "8080"
    ports:
      - "19475:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  mock-opencode:
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
    command: ["go", "run", "./cmd/mockprovider", "-listen", "0.0.0.0:8080", "-fixtures", "test/e2e/mocks/matrix"]
    expose:
      - "8080"
    ports:
      - "19476:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30

  paylessforai-app:
    image: golang:1.26-bookworm
    working_dir: /src
    volumes:
      - .:/src
      - payless-matrix-data:/tmp/payless-matrix
    command:
      - sh
      - -c
      - |
        go run ./cmd/paylessforai-app
        -data-dir /tmp/payless-matrix
        -listen 0.0.0.0:9472
    expose:
      - "9472"
    ports:
      - "19477:9472"
    depends_on:
      mock-openrouter:
        condition: service_healthy
      mock-surplus:
        condition: service_healthy
      mock-opencode:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9472/readyz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  payless-matrix-data:
