{{define "admin.html"}}
<!doctype html>
<html><head><title>Stat Server Admin</title><style>body{font:15px system-ui;background:#f5f7fa;color:#17202a;margin:30px}main{max-width:1100px;margin:auto}.card{background:#fff;border-radius:14px;padding:20px;margin:15px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.score{font-size:30px;color:#2563eb}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}input{padding:8px;margin:3px;border:1px solid #cbd5e1;border-radius:6px}button{padding:8px 12px;border:0;border-radius:6px;background:#2563eb;color:white}</style></head>
<body><main><h1>Stat Server Administration</h1><div class="card"><h2>Capability profiles</h2><form id="profile"><input name="key" placeholder="role key" required><input name="display_name" placeholder="Display name" required><input name="description" placeholder="Description"><button>Create role</button></form><div id="profiles">Loading…</div></div><div class="card"><h2>Source health</h2><div id="sources">Loading…</div></div><div class="card"><h2>Manual score signal</h2><form id="sig"><input name="key" placeholder="signal key" required><input name="display_name" placeholder="Display name" required><button>Create</button></form><div id="msg"></div></div></main>
<script>async function load(){let p=await fetch('/admin/api/v1/capability-profiles').then(r=>r.json());document.getElementById('profiles').innerHTML='<div class="grid">'+(p.data||[]).map(x=>'<div><h3>'+x.display_name+'</h3><div class="score">v'+x.version+'</div><p>'+x.description+'</p><small>'+x.state+' · coverage '+x.minimum_coverage+' · version '+x.version_id+'</small><form onsubmit="rule(event,'+x.version_id+')"><input name="selector" placeholder="benchmark name" required><input name="weight" type="number" value="1" min="1"><button>Add rule</button></form></div>').join('')+'</div>';let s=await fetch('/admin/api/v1/sources').then(r=>r.json()).catch(()=>({data:[]}));document.getElementById('sources').innerHTML='<table><tr><th>Source</th><th>Records</th><th>Last success</th></tr>'+(s.data||[]).map(x=>'<tr><td>'+x.display_name+'</td><td>'+x.record_count+'</td><td>'+x.last_success_at+'</td></tr>').join('')}</script>
<script>async function rule(e,id){e.preventDefault();let f=new FormData(e.target);await fetch('/admin/api/v1/profile-versions/'+id+'/components',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({signal_type:'benchmark',selector:f.get('selector'),weight:Number(f.get('weight')),min_value:0,max_value:1,direction:'higher'})});load()}document.getElementById('profile').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await fetch('/admin/api/v1/capability-profiles/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});load()};document.getElementById('sig').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await fetch('/admin/api/v1/manual-signals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(f))});document.getElementById('msg').textContent=r.ok?'Saved':'Error'};load()</script>
</body></html>
{{end}}
