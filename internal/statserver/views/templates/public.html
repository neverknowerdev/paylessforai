{{define "public.html"}}
<!doctype html>
<html><head><meta charset="utf-8"><title>PayLessForAI Stat Server</title>
<style>body{font:15px system-ui;margin:40px;color:#16202a;background:#f5f7fa}main{max-width:1100px;margin:auto}h1{margin-bottom:4px}.muted{color:#64748b}.card{background:white;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 12px #122b3b12}input{padding:10px;border:1px solid #cbd5e1;border-radius:8px;width:60%}button{padding:10px 15px;border:0;border-radius:8px;background:#2563eb;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #e2e8f0;font-size:13px}.pill{padding:3px 7px;border-radius:12px;background:#e0f2fe}</style></head>
<body><main><h1>PayLessForAI Stat Server</h1><div class="muted">Public model catalog and runtime intelligence</div><div class="card"><input id="q" placeholder="Search models, e.g. deepseek flash"><button onclick="load()">Search</button></div><div class="card"><div id="status">Loading catalog…</div><table><thead><tr><th>Model</th><th>Creator</th><th>Offerings</th><th>Benchmarks</th><th>Updated</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script>async function load(){let q=document.getElementById('q').value;let u=q?'/v1/models/search?q='+encodeURIComponent(q):'/v1/models?limit=100';let d=await fetch(u).then(r=>r.json());let a=d.data||d.results||[];document.getElementById('status').textContent=(d.total||a.length)+' models';document.getElementById('rows').innerHTML=a.map(x=>'<tr><td><b>'+esc(x.display_name||x.name)+'</b><br><span class="muted">'+esc(x.canonical_slug||x.id)+'</span></td><td>'+esc(x.creator||'—')+'</td><td><span class="pill">'+(x.offering_count||0)+'</span></td><td>'+((x.benchmark_count||0))+'</td><td>'+esc(x.updated_at||'')+'</td></tr>').join('')}function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}load()</script>
</body></html>
{{end}}
